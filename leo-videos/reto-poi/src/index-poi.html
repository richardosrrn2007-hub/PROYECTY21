<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05060A}</style></head><body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>window.FONT_OVERRIDE = new URLSearchParams(location.search).get('font') || 'Montserrat';</script>
<script src="lib.js"></script><script src="bg3d.js"></script><script src="leo-flat.js"></script><script src="real.js"></script><script src="timeline-poi.js"></script>
<script>
const load=(src)=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=r;document.body.appendChild(s);});
Promise.all([document.fonts.load(`900 64px "${window.FONT_OVERRIDE}"`),document.fonts.load('800 64px "Inter"'),document.fonts.load('500 64px "Inter"'),document.fonts.load('900 64px "Inter Display"')])
.then(()=>load('poi3.js')).then(()=>load('poi4.js')).then(()=>load('poi-video.js'));
</script></body></html>
